<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РАЗОР — Яхья Миннибаев | Разработка приложений</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }

  #matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.9;
    pointer-events: none;
  }

  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1rem;
  }

  /* Затемнённая размытая подложка по центру, чтобы текст читался */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0,0,0,0.88) 0%,
      rgba(0,0,0,0.78) 40%,
      rgba(0,0,0,0.45) 70%,
      rgba(0,0,0,0.1) 100%
    );
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: -1;
    pointer-events: none;
  }

  .subtitle {
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 0.3em;
    font-weight: 800;
    background: linear-gradient(180deg, #fff 0%, #bdbdbd 45%, #4a4a4a 55%, #cfcfcf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(0,255,100,0.15);
    padding-left: 0.3em;
  }

  .divider {
    width: min(400px, 60%);
    height: 3px;
    margin: 1.2rem 0;
    background: linear-gradient(90deg, transparent, #d9d9d9, transparent);
    box-shadow: 0 0 12px rgba(0,255,100,0.5);
  }

  .title {
    font-size: clamp(3rem, 12vw, 9rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 30%, #6b6b6b 52%, #2b2b2b 58%, #a8a8a8 70%, #f0f0f0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(0,255,90,0.55))
            drop-shadow(0 6px 24px rgba(0,255,90,0.35));
    margin-bottom: 2rem;
  }

  .services {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-width: 700px;
    margin-bottom: 2rem;
  }

  .services p {
    color: #d7ffe1;
    font-size: clamp(0.9rem, 1.6vw, 1.1rem);
    text-shadow: 0 0 8px rgba(0,255,90,0.4), 0 1px 2px #000;
  }

  .services p:first-child {
    color: #fff;
    font-weight: 700;
    font-size: clamp(1.1rem, 2vw, 1.4rem);
    letter-spacing: 0.05em;
  }

  .contact-block {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: min(420px, 100%);
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.8rem 0.6rem 1rem;
    border: 1px solid rgba(0,255,90,0.4);
    border-radius: 14px;
    background: rgba(0, 40, 15, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(0,255,90,0.15);
    transition: 0.25s ease;
  }
  .contact-row:hover {
    border-color: #00ff5a;
    box-shadow: 0 0 30px rgba(0,255,90,0.5);
  }

  .contact-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    color: #00ff5a;
    filter: drop-shadow(0 0 6px #00ff5a);
  }

  .contact-text {
    flex: 1;
    text-align: left;
    line-height: 1.3;
    min-width: 0;
  }
  .contact-label {
    display: block;
    color: #b8c8be;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .contact-value {
    display: block;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    background: linear-gradient(180deg, #fff, #b8b8b8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact-value a { color: inherit; text-decoration: none; }

  .copy-btn {
    flex-shrink: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #00ff5a;
    background: rgba(0,255,90,0.08);
    border: 1px solid rgba(0,255,90,0.5);
    border-radius: 8px;
    padding: 0.45rem 0.7rem;
    transition: 0.2s;
  }
  .copy-btn:hover { background: rgba(0,255,90,0.2); }
  .copy-btn.copied {
    color: #0a1a0f;
    background: #00ff5a;
    border-color: #00ff5a;
  }

  @media (max-width: 420px) {
    .contact-value { font-size: 0.95rem; }
    .copy-btn { font-size: 0.7rem; padding: 0.4rem 0.55rem; }
  }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<main class="hero">
  <h1 class="subtitle">ПРОГРАММИСТ</h1>
  <div class="divider"></div>
  <h2 class="title">РАЗОР</h2>

  <div class="services">
    <p>Яхья Миннибаев Русланович</p>
    <p>Создаю мобильные приложения, игры, мессенджеры, веб-приложения, конвертеры и многое другое</p>
    <p>Работаю в кратчайшие сроки</p>
    <p>Хорошие цены</p>
  </div>

  <div class="contact-block">

    <!-- Telegram -->
    <div class="contact-row">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M2 12l20-9-4 20-7-6-3 4-1-7z"/>
      </svg>
      <div class="contact-text">
        <span class="contact-label">ТГ для связи</span>
        <span class="contact-value">
          <a href="https://t.me/Razorayua" target="_blank" rel="noopener">Razorayua</a>
        </span>
      </div>
      <button class="copy-btn" data-copy="Razorayua" type="button">Скопировать</button>
    </div>

    <!-- Телефон -->
    <div class="contact-row">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8z"/>
      </svg>
      <div class="contact-text">
        <span class="contact-label">Номер для связи</span>
        <span class="contact-value">
          <a href="tel:+79377900057">+7 937 790 00 57</a>
        </span>
      </div>
      <button class="copy-btn" data-copy="+79377900057" type="button">Скопировать</button>
    </div>

  </div>
</main>

<script>
/* ---------- Матричный дождь: 0/1 падают по краям ---------- */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

let w, h, cols, yPositions;
const fontSize = 16;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cols = Math.floor(w / fontSize);
  // каждая колонка стартует в случайной точке по высоте,
  // чтобы дождь был виден сразу после загрузки
  yPositions = Array.from({ length: cols }, () => Math.random() * (h / fontSize));
}

/* Края: слева ~30%, справа ~30%. Центр не трогаем. */
function isEdgeColumn(i) {
  const ratio = i / cols;
  return ratio < 0.30 || ratio > 0.70;
}

function draw() {
  // лёгкое затухание — создаёт хвосты
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, w, h);

  ctx.font = fontSize + 'px monospace';

  for (let i = 0; i < cols; i++) {
    if (!isEdgeColumn(i)) continue;

    const x = i * fontSize;
    const y = yPositions[i] * fontSize;

    // головной символ — ярко-белый
    ctx.fillStyle = '#eaffef';
    ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y);

    // хвост из зелёных 0/1
    ctx.fillStyle = 'rgba(0, 255, 90, 0.85)';
    ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y + fontSize);

    ctx.fillStyle = 'rgba(0, 255, 90, 0.55)';
    ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y + fontSize * 2);

    ctx.fillStyle = 'rgba(0, 255, 90, 0.3)';
    ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y + fontSize * 3);

    // когда колонка ушла за нижний край — сбрасываем наверх
    if (y > h && Math.random() > 0.975) {
      yPositions[i] = 0;
    }
    yPositions[i] += 0.7;
  }
}

window.addEventListener('resize', resize);
resize();
setInterval(draw, 50);

/* ---------- Кнопки "Скопировать" ---------- */
document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const value = btn.dataset.copy;
    const original = btn.textContent;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      btn.textContent = 'Скопировано ✓';
      btn.classList.add('copied');
    } catch (e) {
      btn.textContent = 'Ошибка';
    }

    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  });
});
</script>

</body>
  </html>
